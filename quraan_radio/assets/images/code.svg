<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <defs>
    <!-- Radial subtle gradient for glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#735c00" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#0f382c" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f382c" stop-opacity="0" />
    </radialGradient>
    
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#735c00" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#b89728" stop-opacity="0.9" />
    </linearGradient>

    <!-- Star Polygon Definition (10-Pointed Star) -->
    <!-- Outer radius: 210, Inner radius: 82 -->
    <!-- Angles in deg: 0, 18, 36, 54, 72, 90, 108, 126, 144, 162, 180, 198, 216, 234, 252, 270, 288, 306, 324, 342 -->
  </defs>

  <!-- Ambient background glow disc -->
  <circle cx="250" cy="250" r="225" fill="url(#starGlow)" />

  <!-- Outer Concentric Reference Circles -->
  <circle cx="250" cy="250" r="236" stroke="#735c00" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 6" />
  <circle cx="250" cy="250" r="218" stroke="#0f382c" stroke-width="1.2" stroke-opacity="0.3" />
  <circle cx="250" cy="250" r="208" stroke="#735c00" stroke-width="0.75" stroke-opacity="0.4" />
  <circle cx="250" cy="250" r="162" stroke="#0f382c" stroke-width="0.8" stroke-opacity="0.2" stroke-dasharray="2 4" />
  <circle cx="250" cy="250" r="112" stroke="#735c00" stroke-width="1" stroke-opacity="0.35" />
  <circle cx="250" cy="250" r="82" stroke="#0f382c" stroke-width="0.75" stroke-opacity="0.25" stroke-dasharray="3 3" />
  <circle cx="250" cy="250" r="45" stroke="#735c00" stroke-width="1" stroke-opacity="0.3" />

  <!-- Cardinal and Intercardinal Axis Radians -->
  <g stroke="#735c00" stroke-width="0.75" stroke-opacity="0.25">
    <line x1="250" y1="12" x2="250" y2="488" stroke-dasharray="6 6" />
    <line x1="12" y1="250" x2="488" y2="250" stroke-dasharray="6 6" />
    <line x1="82" y1="82" x2="418" y2="418" stroke-dasharray="4 6" />
    <line x1="82" y1="418" x2="418" y2="82" stroke-dasharray="4 6" />
  </g>

  <!-- 10-Point Primary Star Polygon -->
  <!-- Center: (250, 250). R_outer=210, R_inner=84. Top peak pointing at -90 deg (270) -->
  <polygon 
    points="
      250.0,40.0 
      274.6,182.0 
      373.4,79.9 
      314.4,203.2 
      449.8,185.1 
      333.1,237.0 
      449.8,314.9 
      314.4,296.8 
      373.4,420.1 
      274.6,318.0 
      250.0,460.0 
      225.4,318.0 
      126.6,420.1 
      185.6,296.8 
      50.2,314.9 
      166.9,237.0 
      50.2,185.1 
      185.6,203.2 
      126.6,79.9 
      225.4,182.0"
    fill="#0f382c" 
    fill-opacity="0.04"
    stroke="url(#goldStroke)" 
    stroke-width="2" 
    stroke-linejoin="round"
  />

  <!-- Secondary Inverted 10-Point Star Rosette Interlace -->
  <!-- Rotated 18 degrees, R_outer=165, R_inner=95 -->
  <polygon 
    points="
      299.1,92.5 
      296.0,173.2 
      399.1,165.1 
      329.8,214.8 
      414.2,276.1 
      338.9,259.9 
      338.9,340.1 
      296.0,326.8 
      250.0,415.0 
      242.0,344.8 
      161.1,340.1 
      204.0,326.8 
      85.8,276.1 
      161.1,259.9 
      100.9,165.1 
      170.2,214.8 
      200.9,92.5 
      204.0,173.2 
      250.0,85.0 
      258.0,155.2"
    fill="none" 
    stroke="#0f382c" 
    stroke-width="1.2" 
    stroke-opacity="0.35" 
    stroke-linejoin="round"
    stroke-dasharray="5 3"
  />

  <!-- Internal Octagonal / Decagonal Geometric Web Lines -->
  <g stroke="#735c00" stroke-width="0.8" stroke-opacity="0.3">
    <!-- Star chord diagonals creating the Islamic geometric knotwork -->
    <polygon points="250.0,40.0 449.8,185.1 373.4,420.1 126.6,420.1 50.2,185.1" fill="none" />
    <polygon points="373.4,79.9 449.8,314.9 250.0,460.0 50.2,314.9 126.6,79.9" fill="none" />
  </g>

  <!-- Central Concentric Medallion Rings with Pips -->
  <circle cx="250" cy="250" r="64" stroke="#735c00" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 5" />
  <circle cx="250" cy="250" r="32" stroke="#0f382c" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="250" cy="250" r="4" fill="#735c00" fill-opacity="0.8" />

  <!-- 10 Accent Diamond Pips at Star Inner Creases -->
  <g fill="#735c00" opacity="0.6">
    <circle cx="274.6" cy="182.0" r="2.5" />
    <circle cx="314.4" cy="203.2" r="2.5" />
    <circle cx="333.1" cy="237.0" r="2.5" />
    <circle cx="314.4" cy="296.8" r="2.5" />
    <circle cx="274.6" cy="318.0" r="2.5" />
    <circle cx="225.4" cy="318.0" r="2.5" />
    <circle cx="185.6" cy="296.8" r="2.5" />
    <circle cx="166.9" cy="237.0" r="2.5" />
    <circle cx="185.6" cy="203.2" r="2.5" />
    <circle cx="225.4" cy="182.0" r="2.5" />
  </g>
</svg>